spring:
  mvc:
    async:
      request-timeout: 120s
  application:
    name: trishakti-crm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trishakti_crm}
    username: ${DB_USER:trishakti}
    password: ${DB_PASSWORD:trishakti}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      pool-name: trishakti-pool
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 500
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 32
    show-sql: false
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      continue-on-error: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  tomcat:
    connection-timeout: 120s
    keep-alive-timeout: 120s
    threads:
      max: 200
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:please-change-this-to-a-long-random-secret-at-least-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    issuer: shri-trishakti-infra-realtors
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  company:
    name: "Shri Trishakti Infra Realtors Pvt Ltd"
  reminders:
    lookahead-minutes: 60
    scan-cron: "0 */5 * * * *"
  seed:
    enabled: ${SEED_ENABLED:true}

logging:
  level:
    com.trishakti.crm: INFO
    org.hibernate.SQL: WARN
