# Render Blueprint — deploys the Spring Boot API + a managed PostgreSQL database.
# Usage:
#   1. Push this repo to GitHub.
#   2. Render Dashboard -> New -> Blueprint -> pick this repo. Render reads render.yaml.
#   3. After the first deploy, set CORS_ALLOWED_ORIGINS to your Vercel URL (see below).
#
# The web frontend is deployed separately on Vercel (see web/vercel.json and docs/DEPLOYMENT.md).

databases:
  - name: trishakti-crm-db
    plan: free
    databaseName: trishakti_crm
    user: trishakti
    region: singapore

services:
  - type: web
    name: trishakti-crm-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: SEED_ENABLED
        value: "true"            # seeds demo users on first boot; set "false" once you have real data
      - key: JWT_SECRET
        generateValue: true       # Render generates a strong secret and keeps it stable
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      # ---- database wiring (composed into a JDBC URL by application-render.yml) ----
      - key: DB_HOST
        fromDatabase:
          name: trishakti-crm-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: trishakti-crm-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: trishakti-crm-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: trishakti-crm-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: trishakti-crm-db
          property: password
      # ---- set this after the Vercel deploy (exact origin, comma-separated; '*' patterns allowed) ----
      - key: CORS_ALLOWED_ORIGINS
        sync: false
